[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skyprognos"
version = "0.1.0"
description = "Aviation fleet-health platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "xgboost",
    "scikit-learn",
    "onnxruntime",
    "onnxscript",
    "streamlit",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "/mnt/sda5/Projects/QT"
venv = ".venv"
extraPaths = ["src", "app"]
exclude = ["ml_notebooks"]
